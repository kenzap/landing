<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="1100" height="480">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .sheet-ideal { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .sheet-remnant { fill: #f1f4fb; stroke: #1941df; stroke-width: 2.2; }
      .scrap-void { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 4,4; }
      .part-blue { fill: #e8ecfc; stroke: #1941df; stroke-width: 1.8; }
      .part-warn { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.8; }
      .label-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; fill: #0a0a08; }
      .label-desc { font-family: 'DM Sans', sans-serif; font-size: 13px; fill: #4a4f5c; }
      .tag { font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; }
      .measure { font-family: 'DM Mono', monospace; font-size: 10px; fill: #8a9099; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1100" height="480" rx="8" stroke="#dde1f0" stroke-width="1.5" />

  <!-- Left Side: Traditional Assumption -->
  <g transform="translate(40, 36)">
    <text x="0" y="20" class="label-title">WHAT SOFTWARE ASSUMES</text>
    <text x="0" y="42" class="label-desc">Perfect, pristine rectangular stock from warehouse racks</text>

    <!-- Pristine Sheet -->
    <g transform="translate(0, 65)">
      <rect class="sheet-ideal" width="480" height="300" rx="4" />
      
      <!-- Regular grid parts -->
      <g transform="translate(30, 30)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(145, 30)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(260, 30)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(375, 30)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>

      <g transform="translate(30, 115)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(145, 115)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(260, 115)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(375, 115)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>

      <g transform="translate(30, 200)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(145, 200)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(260, 200)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(375, 200)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>

      <!-- Status badge -->
      <rect x="20" y="260" width="160" height="24" rx="3" fill="#e2e8f0" />
      <text x="30" y="276" class="tag" fill="#475569">RECTANGULAR BOUNDS</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="550" y1="40" x2="550" y2="440" stroke="#dde1f0" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Right Side: Shop Floor Reality -->
  <g transform="translate(580, 36)">
    <text x="0" y="20" class="label-title">THE SHOP FLOOR REALITY</text>
    <text x="0" y="42" class="label-desc">Irregular remnants, cut scrap skeletons, and odd off-cuts</text>

    <!-- Remnant Plate (Irregular stepped polygon) -->
    <g transform="translate(0, 65)">
      <!-- Irregular plate outline -->
      <path class="sheet-remnant" d="M 0,0 L 480,0 L 480,140 L 320,140 L 320,300 L 0,300 Z" />

      <!-- Previously cut cutout zone (unusable) -->
      <g transform="translate(320, 140)">
        <rect class="scrap-void" width="160" height="160" />
        <line x1="0" y1="0" x2="160" y2="160" stroke="#cbd5e1" />
        <line x1="160" y1="0" x2="0" y2="160" stroke="#cbd5e1" />
        <text x="80" y="85" font-family="'DM Mono', monospace" font-size="11px" fill="#94a3b8" text-anchor="middle">PREVIOUS JOB CUT</text>
      </g>

      <!-- Internal pre-existing pierce / hole -->
      <circle cx="80" cy="70" r="28" fill="#e2e8f0" stroke="#cbd5e1" stroke-dasharray="3,3" />
      <text x="80" y="74" font-family="'DM Mono', monospace" font-size="9px" fill="#94a3b8" text-anchor="middle">OFF-CUT VOID</text>

      <!-- Intelligently placed new parts fitting in remnant geometry -->
      <g transform="translate(130, 20)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(240, 20)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(350, 20)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>

      <g transform="translate(20, 130)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(130, 110)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>
      <g transform="translate(210, 180)">
        <polygon class="part-blue" points="80,60 0,60 0,20 30,0 90,0 100,30" />
      </g>

      <g transform="translate(40, 215)">
        <polygon class="part-blue" points="0,0 80,0 100,40 70,60 10,60 0,30" />
      </g>

      <!-- Status badge -->
      <rect x="20" y="260" width="180" height="24" rx="3" fill="#e8ecfc" />
      <text x="30" y="276" class="tag" fill="#1941df">DYNAMIC REMNANT NESTING</text>
    </g>
  </g>
</svg>
